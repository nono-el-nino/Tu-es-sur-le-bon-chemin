name: Contrôle visuel temporaire de la carte
on:
  push:
    branches: [carte-francais]
    paths: [src/**, public/geo/**, scripts/visual/**, .github/workflows/visual-check.yml]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx -y playwright@1.56.1 install --with-deps chromium
      - run: npm i --no-save playwright@1.56.1
      - run: |
          npx vite preview --port 4173 &
          sleep 3
          mkdir -p shots && (node scripts/visual/shots.mjs 2>&1 | tee shots/log.txt) || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan visual-results
          git rm -rfq --cached .
          git add -f shots
          git commit -qm "Captures de contrôle (temporaire)"
          git push -f origin visual-results
