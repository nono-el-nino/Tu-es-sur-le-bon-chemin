name: Relevé temporaire de la structure AELF
on:
  push:
    branches: [feature-carte]
    paths: [scripts/crawl-aelf-structure.mjs, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/crawl-aelf-structure.mjs > structure-log.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan structure-results
          git rm -rfq --cached .
          git add -f scripts/data/aelf-structure.json structure-log.txt || git add -f structure-log.txt
          git commit -qm "Structure AELF (temporaire)"
          git push -f origin structure-results
