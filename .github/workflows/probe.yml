name: Sonde temporaire (AELF, fonds de carte)
on:
  push:
    branches: [feature-carte]
    paths: [scripts/probe/probe.mjs, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe/probe.mjs > probe-out.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rfq --cached .
          git add -f probe-out probe-out.txt
          git commit -qm "Résultats de sonde (temporaire)"
          git push -f origin probe-results
